services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\Complying\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'
      - '../src/ComplyingBundle.php'
      - '../src/EventSubscriber/ComplianceOtelHttpSubscriber.php'
      - '../src/Service/ComplianceOtelExporter.php'
      - '../src/Service/ComplianceOtelTracer.php'
      - '../src/Service/TracingCompliancePolicyService.php'
      - '../src/Service/S3DecisionExportService.php'
      - '../src/Service/S3ExportClient.php'
      - '../src/Service/SignedIncidentWebhookService.php'
      - '../src/Service/WebhookSigner.php'
      - '../src/Service/ExternalComplianceRiskScoreService.php'
      - '../src/Service/ExternalRiskClient.php'

  App\Complying\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']

  App\Complying\ServiceInterface\CaseQueueServiceInterface: '@App\Complying\Service\CaseQueueService'
