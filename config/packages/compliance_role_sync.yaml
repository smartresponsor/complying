services:
  App\Complying\Resolver\ComplianceSecurityRoleActorResolver:
    autowire: true
    autoconfigure: true

  App\Complying\Service\ComplianceRoleAwarePolicyEvaluationService:
    decorates: 'App\Complying\ServiceInterface\CompliancePolicyEvaluationServiceInterface'
    arguments:
      - '@App\Complying\Service\ComplianceRoleAwarePolicyEvaluationService.inner'
      - '@App\Complying\Resolver\ComplianceSecurityRoleActorResolver'

  App\Complying\Service\ComplianceRoleAwareAuditTrailService:
    decorates: 'App\Complying\Service\ComplianceAuditTrailService'
    arguments:
      - '@App\Complying\Service\ComplianceRoleAwareAuditTrailService.inner'
      - '@App\Complying\Resolver\ComplianceSecurityRoleActorResolver'
