services:
  App\Complying\Service\ComplianceWebhookSigner:
    arguments:
      $secret: '%env(COMPLIANCE_WEBHOOK_SECRET)%'

  App\Complying\Service\ComplianceSignedIncidentWebhookService:
    decorates: 'App\Complying\Service\ComplianceIncidentWebhookService'
    arguments:
      - '@App\Complying\Service\ComplianceSignedIncidentWebhookService.inner'
      - '@App\Complying\Service\ComplianceWebhookSigner'
