parameters: { }

services:
  App\Complying\Mapper\FactMapper: ~
  App\Complying\Repository\ComplianceConfigRepository:
    autowire: true
    autoconfigure: true
    tags: [ 'doctrine.repository_service' ]
  App\Complying\Repository\PolicyRegistryRepository:
    autowire: true
    autoconfigure: true
    tags: [ 'doctrine.repository_service' ]
  App\Complying\Repository\IncidentWebhookRepository:
    autowire: true
    autoconfigure: true
    tags: [ 'doctrine.repository_service' ]
  App\Complying\Repository\SanctionListEntryRepository:
    autowire: true
    autoconfigure: true
    tags: [ 'doctrine.repository_service' ]
  App\Complying\RepositoryInterface\SanctionListEntryRepositoryInterface: '@App\Complying\Repository\SanctionListEntryRepository'
  App\Complying\Service\Tenant\TenantProvider: ~
  App\Complying\ServiceInterface\ComplianceAuditTrailServiceInterface: '@App\Complying\Service\ComplianceAuditTrailService'
  App\Complying\Service\ComplianceConfigService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\ComplianceAuditTrailService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\ConsentChecker:
    autowire: true
    autoconfigure: true
  App\Complying\Service\DecisionExportService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\DlpRedactor:
    autowire: true
    autoconfigure: true
  App\Complying\Service\ExportService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\ComplianceDeferredDecisionService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\ComplianceDecisionLogWriter:
    autowire: true
    autoconfigure: true
  App\Complying\ServiceInterface\SanctionImportServiceInterface: '@App\Complying\Service\SanctionImportService'
  App\Complying\Service\IncidentWebhookService:
    autowire: true
    autoconfigure: true
    arguments:
      $targetUrl: '%env(resolve:COMPLIANCE_WEBHOOK_URL)%'
  App\Complying\Service\RiskScoreService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\CaseQueueService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\SanctionImportService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\LegalHoldService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\MetricsRegistry:
    autowire: true
    autoconfigure: true
  App\Complying\Service\PolicyHistoryService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\ReportingService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\ComplianceRetentionService:
    autowire: true
    autoconfigure: true
  App\Complying\Service\ComplianceCaseWorkerService:
    autowire: true
    autoconfigure: true
