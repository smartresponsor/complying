name: compliance-ci

on:
  push:
    paths:
      - 'src/**'
      - 'config/**'
      - 'tools/**'
      - '.github/workflows/compliance-ci.yml'
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install deps
        run: composer install --no-interaction --prefer-dist
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite=Compliance
      - name: SLO check
        run: php tools/slo/compliance_slo_check.php http://localhost:8080/compliance/status 10 900 1 || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report-daily
          path: report-daily.csv
